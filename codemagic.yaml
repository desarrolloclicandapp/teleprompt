workflows:
  ios-workflow:
    name: Teleprompt iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "Teleprompt.xcodeproj"
        XCODE_SCHEME: "Teleprompt"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.viraltia.teleprompt
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build and archive
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
